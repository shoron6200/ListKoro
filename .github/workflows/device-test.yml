# Real Android (emulator) e APK chaliye test: yt-dlp start hoy kina, video download hoy kina.
# Result: run er log + Artifacts → smoke-out (debug.json, steps, logcat.txt)
name: Device test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build x86_64 release APK (same R8 config as the phone build)
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon -PabiFilters=x86_64 -Pminify=true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/ci/smoke.sh "$(ls android/app/build/outputs/apk/release/*.apk | head -1)" smoke-out

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-out
          path: smoke-out/
          retention-days: 14
