# Builds an installable ListKoro APK on GitHub's servers.
# Run it: GitHub → Actions → "Android APK" → Run workflow (or push to main).
# Download it: open the finished run → Artifacts → listkoro-apk (zip er bhitore .apk).
#
# Size: default shudhu arm64-v8a (2017+ prai sob phone) + R8 shrink, tai APK choto.
# Purano 32-bit phone hole "Run workflow" e abi = arm64-v8a,armeabi-v7a dao.
#
# Signing: if the repository has the secrets below, the APK is signed with your
# own key (keep that key: updates must use the same one). Without them it is
# signed with a fresh debug key every run, which installs fine but every new
# build needs an uninstall first (history muche jabe).
#   ANDROID_KEYSTORE_BASE64   base64 of a .jks keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Android APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "CPU (comma diye): arm64-v8a | armeabi-v7a | x86_64"
        default: "arm64-v8a"
      minify:
        description: "R8 shrink (launch e crash korle false)"
        default: "true"
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ABI: ${{ github.event.inputs.abi || 'arm64-v8a' }}
      MINIFY: ${{ github.event.inputs.minify || 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The runner already has the Android SDK; this only accepts its licences.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Check before building
        run: |
          python3 -m py_compile server/*.py
          node -e "new Function(require('fs').readFileSync('server/static/app.js','utf8'))"

      - name: Use your signing key, if provided
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 -d > android/app/release.jks

      - name: Build the release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_LISTKORO_STORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && 'release.jks' || '' }}
          ORG_GRADLE_PROJECT_LISTKORO_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_LISTKORO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_LISTKORO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          chmod +x gradlew &&
          ./gradlew assembleRelease --no-daemon --stacktrace
          -PabiFilters=${{ env.ABI }}
          -Pminify=${{ env.MINIFY }}
          -PversionCode=${{ github.run_number }}
          -PversionName=1.0.${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk "out/ListKoro-1.0.${{ github.run_number }}-${ABI//,/-}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v5
        with:
          name: listkoro-apk
          path: out/*.apk
          retention-days: 30
